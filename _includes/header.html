<!-- Accessible navigation: logo intentionally lives in the hero, not the sidebar. -->
<header class="themeix-aside dabiz-sidebar">
  <div class="control-bar"><div class="text-center"><span class="menu-toggle" role="button" tabindex="0" aria-label="Abrir menú"><i class="chart"></i><i class="chart"></i><i class="chart"></i></span></div></div>
  <div class="themeix-slide-menu menu-open navbar-scrolled">
    <div class="themeix-fixed-nav">
      <nav aria-label="Navegación principal">
        <ul class="themeix-nav-menu list-inline">
          <li><a class="btn-animated" href="{{ '/#about' | relative_url }}"><i class="fa fa-home" aria-hidden="true"></i>Inicio</a></li>
          <li><a class="btn-animated" href="{{ '/#services' | relative_url }}"><i class="fa fa-briefcase" aria-hidden="true"></i>Servicios</a></li>
          <li><a class="btn-animated" href="{{ '/#portfolio' | relative_url }}"><i class="fa fa-code" aria-hidden="true"></i>Proyectos</a></li>
          <li><a class="btn-animated" href="{{ '/#sobre-mi' | relative_url }}"><i class="fa fa-user" aria-hidden="true"></i>Sobre mí</a></li>
          {% if site.blog %}<li><a class="btn-animated" href="{{ site.blog }}" target="_blank" rel="noopener noreferrer"><i class="fa fa-pencil" aria-hidden="true"></i>Blog</a></li>{% endif %}
          <li><a class="btn-animated" href="{{ '/#contact' | relative_url }}"><i class="fa fa-envelope" aria-hidden="true"></i>Contacto</a></li>
        </ul>
      </nav>
      <div class="homepage-copyright dabiz-side-footer">
        <p>Arquitectura de software<br>y desarrollo backend.</p>
        <ul class="list-inline fixed-social-share">
          <li class="list-inline-item"><a href="{{ site.github_url }}" aria-label="GitHub" target="_blank" rel="noopener noreferrer"><i class="fa fa-github" aria-hidden="true"></i></a></li>
          <li class="list-inline-item"><a href="https://www.linkedin.com/in/dabizme/" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><i class="fa fa-linkedin" aria-hidden="true"></i></a></li>
          <li class="list-inline-item"><a href="{{ '/#contact' | relative_url }}" aria-label="Contacto"><i class="fa fa-envelope" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
  </div>
</header>
