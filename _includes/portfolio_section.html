<!-- Start Portfolio -->
<section class="full-page clearfix" id="portfolio">
    <div class="services">
        <div class="container-fluid">
            <div class="services-wrapper text-center">
                <div class="section-title">
                    <div class="border-center"></div>
                    <h2>Casos profesionales</h2>
                    <div class="border-center"></div>
                </div>
                <p>Problemas de arquitectura e integración abordados en proyectos empresariales, presentados sin información confidencial.</p>
                <div class="row">
                    {% for case in site.data.cases %}
                    <div class="col-lg-4 col-md-6">
                        <div class="services-box wow fadeIn text-center">
                            <h5>{{ case.title }}</h5>
                            <p>{{ case.summary }}</p>
                            <p><small>{{ case.tags }}</small></p>
                            <a class="btn btn-link" href="{{ case.detail | relative_url }}">Leer el caso <i class="fa fa-long-arrow-right" aria-hidden="true"></i></a>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
<!-- End Portfolio -->
