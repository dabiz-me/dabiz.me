<!-- Start Skills -->
<section class="full-page pt-30 clearfix" id="skills">
    <div class="skills">
        <div class="container-fluid">
            <div class="skills-wrapper text-center">
                <div class="section-title">
                    <h2>Especialidades técnicas</h2>
                    <div class="border-center"></div>
                </div>
                <div class="row">
                    {% for skills_data in site.data.skills %}
                    <div class="col-lg-4 col-md-6">
                        <div class="skills-box wow fadeIn text-center">
                            <h5>{{ skills_data.title }}</h5>
                            <p>{{ skills_data.desc }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
<!-- End Skills -->
