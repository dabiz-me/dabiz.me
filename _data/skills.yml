- title: Arquitectura y diseño de software
  desc: Diseño de sistemas y componentes, delimitación de responsabilidades, contratos de integración y evolución de aplicaciones existentes.

- title: Java y Spring
  desc: Desarrollo backend con Java, Spring Boot, Spring Security y APIs REST. Experiencia en aplicaciones empresariales y servicios distribuidos.

- title: Identidad y seguridad
  desc: OAuth2, OpenID Connect, Spring Authorization Server, autorización y gestión de identidades en entornos multitenant.

- title: Integraciones y mensajería
  desc: Integración de proveedores externos, APIs, webhooks y arquitecturas orientadas a eventos con RabbitMQ, reintentos e idempotencia.

- title: Cloud, DevOps y observabilidad
  desc: Contenedores, Kubernetes, integración y despliegue continuos, GitOps, Terraform y monitorización con Prometheus y Grafana.

- title: Análisis y dirección técnica
  desc: Análisis de requisitos, decisiones de arquitectura, revisión de soluciones y coordinación técnica de equipos de desarrollo.
